{
  "openapi": "3.0.3",
  "info": {
    "title": "BookBinder Admin API",
    "version": "1.0.0",
    "description": "User-supplied admin contract; existing auth/student APIs are outside this document."
  },
  "security": [
    {
      "sessionCookie": []
    }
  ],
  "paths": {
    "/api/admin/requests": {
      "get": {
        "summary": "전체 신청 목록 및 필터",
        "description": "One row per request. Price is the request-time snapshot. Descending requested_at/id. Count and budget across all requests require every page. Reversed dates return 400.",
        "parameters": [
          {
            "in": "query",
            "name": "status",
            "schema": {
              "type": "string",
              "enum": [
                "PENDING",
                "APPROVED",
                "REJECTED",
                "PURCHASED"
              ]
            },
            "description": "Request status"
          },
          {
            "in": "query",
            "name": "from",
            "schema": {
              "type": "string",
              "format": "date"
            },
            "description": "Inclusive 00:00 Asia/Seoul"
          },
          {
            "in": "query",
            "name": "to",
            "schema": {
              "type": "string",
              "format": "date"
            },
            "description": "Exclusive next day 00:00 Asia/Seoul"
          },
          {
            "in": "query",
            "name": "student_no",
            "schema": {
              "type": "string"
            },
            "description": "Exact match"
          },
          {
            "in": "query",
            "name": "page",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "default": 1
            },
            "description": "Page"
          },
          {
            "in": "query",
            "name": "page_size",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            },
            "description": "Page size"
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "items": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Request"
                      }
                    },
                    "page": {
                      "type": "integer"
                    },
                    "page_size": {
                      "type": "integer"
                    },
                    "total": {
                      "type": "integer"
                    }
                  },
                  "required": [
                    "items",
                    "page",
                    "page_size",
                    "total"
                  ]
                }
              }
            }
          },
          "400": {
            "description": "VALIDATION_ERROR",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "AUTH_REQUIRED",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "FORBIDDEN (write requests also CSRF_FAILED)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "INTERNAL_ERROR",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/admin/requests/{id}/status": {
      "patch": {
        "summary": "신청 상태 변경",
        "description": "PENDING→APPROVED/REJECTED; APPROVED→PURCHASED. Conditional update detects stale expected_status. Status, actor, time and notification commit atomically; retries cannot duplicate notifications.",
        "parameters": [
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9]+$",
              "example": "42"
            }
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Token bound to the authenticated server session."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "status": {
                    "type": "string",
                    "enum": [
                      "PENDING",
                      "APPROVED",
                      "REJECTED",
                      "PURCHASED"
                    ]
                  },
                  "expected_status": {
                    "type": "string",
                    "enum": [
                      "PENDING",
                      "APPROVED",
                      "REJECTED",
                      "PURCHASED"
                    ]
                  },
                  "reason": {
                    "type": "string",
                    "maxLength": 500,
                    "description": "Trimmed 1–500 characters required for REJECTED; cleared otherwise.",
                    "nullable": true
                  }
                },
                "required": [
                  "status",
                  "expected_status"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/StateChange"
                }
              }
            }
          },
          "400": {
            "description": "VALIDATION_ERROR",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "AUTH_REQUIRED",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "FORBIDDEN (write requests also CSRF_FAILED)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "INTERNAL_ERROR",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "NOT_FOUND",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "STATE_CONFLICT",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/admin/requests/export": {
      "post": {
        "summary": "발주용 엑셀 추출",
        "description": "Deduplicate request_ids then require 1–1000 distinct IDs and reread DB. All must be APPROVED with known consistent ISBN prices. group_by_isbn=true emits one row per non-null ISBN; false emits one per request. NULL ISBN requests always remain separate. Quantity is 1. Columns: 도서명/저자/출판사/ISBN/정가/수량. ISBN/text are literal strings, prices numeric. No student information, state changes or persistent files.",
        "parameters": [
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Token bound to the authenticated server session."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "request_ids": {
                    "type": "array",
                    "minItems": 1,
                    "items": {
                      "type": "string",
                      "pattern": "^[0-9]+$",
                      "example": "42"
                    },
                    "description": "Maximum 1000 after deduplication; more returns 413."
                  },
                  "group_by_isbn": {
                    "type": "boolean"
                  }
                },
                "required": [
                  "request_ids",
                  "group_by_isbn"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "XLSX workbook",
            "headers": {
              "Content-Disposition": {
                "schema": {
                  "type": "string"
                },
                "example": "attachment; filename=\"BookBinder_orders_20260923.xlsx\""
              }
            },
            "content": {
              "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "400": {
            "description": "VALIDATION_ERROR",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "AUTH_REQUIRED",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "FORBIDDEN (write requests also CSRF_FAILED)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "INTERNAL_ERROR",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "NOT_FOUND",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "EXPORT_REVIEW_REQUIRED",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "PAYLOAD_TOO_LARGE",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "bookbinder_session",
        "description": "Authenticated librarian session required."
      }
    },
    "schemas": {
      "User": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[0-9]+$",
            "example": "42"
          },
          "name": {
            "type": "string"
          },
          "grade_class": {
            "type": "string",
            "nullable": true
          },
          "student_no": {
            "type": "string",
            "nullable": true
          }
        },
        "required": [
          "id",
          "name",
          "grade_class",
          "student_no"
        ]
      },
      "Request": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[0-9]+$",
            "example": "42"
          },
          "status": {
            "type": "string",
            "enum": [
              "PENDING",
              "APPROVED",
              "REJECTED",
              "PURCHASED"
            ]
          },
          "reject_reason": {
            "type": "string",
            "maxLength": 500,
            "nullable": true
          },
          "processed_by": {
            "type": "string",
            "pattern": "^[0-9]+$",
            "example": "42",
            "nullable": true
          },
          "processed_at": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          },
          "user": {
            "$ref": "#/components/schemas/User"
          },
          "isbn": {
            "type": "string",
            "nullable": true
          },
          "title": {
            "type": "string"
          },
          "author": {
            "type": "string"
          },
          "publisher": {
            "type": "string"
          },
          "price": {
            "type": "integer",
            "minimum": 0,
            "nullable": true
          },
          "requested_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "status",
          "reject_reason",
          "processed_by",
          "processed_at",
          "user",
          "isbn",
          "title",
          "author",
          "publisher",
          "price",
          "requested_at"
        ]
      },
      "StateChange": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[0-9]+$",
            "example": "42"
          },
          "status": {
            "type": "string",
            "enum": [
              "PENDING",
              "APPROVED",
              "REJECTED",
              "PURCHASED"
            ]
          },
          "reject_reason": {
            "type": "string",
            "maxLength": 500,
            "nullable": true
          },
          "processed_by": {
            "type": "string",
            "pattern": "^[0-9]+$",
            "example": "42",
            "nullable": true
          },
          "processed_at": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          }
        },
        "required": [
          "id",
          "status",
          "reject_reason",
          "processed_by",
          "processed_at"
        ]
      },
      "Error": {
        "type": "object",
        "properties": {
          "error": {
            "type": "object",
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              }
            },
            "required": [
              "code",
              "message"
            ]
          }
        },
        "required": [
          "error"
        ]
      }
    }
  }
}
